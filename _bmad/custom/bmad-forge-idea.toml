# Team override for bmad-forge-idea. Committed; applies to every developer.
# Policy: all work happens on a branch cut from fresh origin/main and lands on
# main through a pull request. Keep this file in step with
# bmad-build.toml, bmad-build-auto.toml, bmad-dev-story.toml and every other file in this directory.

[workflow]

persistent_facts = [
  "Version-control policy: every change, code or planning artifact, is made on a branch cut from a freshly fetched origin/main and lands on main through a pull request. Never commit to main directly, and never build on whatever branch happens to be checked out.",
]

activation_steps_prepend = [
  """
Branch gate. Complete this before writing to any file in the repository, including planning artifacts under docs/. Skip it only when the run reads or reports without changing anything.
1. Run `git fetch origin main` so `origin/main` is current. If the fetch fails, report the exact error and HALT.
2. Run `git status --porcelain`. If it prints anything, stop and report the uncommitted changes; do not stash, discard, or commit them on your own, and do not continue until the user has dealt with them.
3. Run `git branch --show-current` and `git log --oneline origin/main..HEAD`. Whatever is checked out is NOT automatically the right base: if HEAD is ahead of origin/main, the checked-out branch is someone else's unmerged work and branching from it silently stacks this run on top of it.
4. Decide the base. Default to `origin/main`. Only build on the current branch when this run genuinely depends on its unmerged commits -- for example when it edits a file that branch just rewrote. In that case say so explicitly, name the branch and the commits being built on, and get the user's agreement before continuing; never make that choice silently.
5. Choose the branch name: `feature/<slug>` when the run changes code, `docs/<slug>` when it changes only documentation or planning artifacts. Lower-case words joined by hyphens, at most 40 characters after the prefix.
6. Run `git switch -c <name> origin/main` (or `git switch -c <name> <agreed-base>`). If the branch already exists, run `git switch <name>`. If the current branch is already the intended one, stay on it.
7. Report the branch and the base it was cut from in one line, then continue with the workflow.
""",
]

on_complete = """
In the completion summary, name the branch that holds the work and the base it was cut from, and state that it lands on main via `git push -u origin <branch>` followed by `gh pr create --base main`. If the branch was cut from anything other than origin/main, say so and name the pull request it must be stacked on. Push or open the pull request only when the user asks for it.
"""
