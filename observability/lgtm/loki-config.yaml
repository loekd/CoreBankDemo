# grafana/otel-lgtm:0.33.0's /otel-lgtm/loki-config.yaml, plus one-day retention (ADR-025).
# Mounted read-only over the image's file by both AppHosts; re-diff against the image on a bump.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

pattern_ingester:
  lifecycler:
    min_ready_duration: 1s

ingester:
  lifecycler:
    min_ready_duration: 1s

frontend:
  scheduler_dns_lookup_period: 1s
  address: 127.0.0.1

query_scheduler:
  use_scheduler_ring: false

compactor:
  working_directory: /data/loki/compactor
  retention_enabled: true
  retention_delete_delay: 1h
  delete_request_store: filesystem
limits_config:
  retention_period: 24h
